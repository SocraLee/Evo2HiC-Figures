# Environment for the figure and analysis scripts of this repository.
# Versions are those of the environment in which the scripts and revision analyses were last run;
# packages without a version are notebook tooling only.
# Model inference / training needs the Evo2HiC environment of the main repo (Evo2HiC.yaml);
# HiCFoundation inference runs in HiCFoundation's own environment (extended_data/ed_table1).
name: Evo2HiC-plot
channels:
  - conda-forge
  - bioconda
  - pytorch
dependencies:
  - python=3.12
  - numpy=1.26.4
  - pandas=3.0.3
  - pyarrow=24.0.0
  - scipy=1.15.2
  - tqdm=4.67.1
  - matplotlib=3.10.1
  - seaborn=0.13.2
  - statsmodels=0.14.4
  - scikit-learn=1.6.1
  - biopython=1.85
  - openpyxl=3.1.5
  - pybigwig=0.3.22
  - hic-straw=1.3.1
  - cooler=0.10.3
  - cooltools=0.7.1
  - pytorch=2.5.1
  - accelerate=1.3.0
  - umap-learn=0.5.7
  - numba=0.60.0
  - llvmlite=0.43.0
  - nbformat
  - jupyter
  - pip
  - pip:
    - tangermeme==0.4.3
    - pycirclize==1.10.1
    - matplotlib-venn==1.1.2
